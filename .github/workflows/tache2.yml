# IFT3913 - Tache 2 : execution des tests de tika-core (dont EndianUtils)
# et analyse de mutation PIT sur EndianUtils.
name: Tache 2 - tests et mutation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compiler et tester tika-core
        run: mvn -B -pl tika-core -am install

      - name: Analyse de mutation PIT sur EndianUtils
        working-directory: tika-core
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Publier le rapport PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-pit
          path: tika-core/target/pit-reports/
